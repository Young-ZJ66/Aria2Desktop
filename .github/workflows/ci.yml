name: 质量检查

# 每次推送到 main、以及发起 PR 时自动执行。
# 本流程只做"检查"：不打包、不创建 Release、不碰 tag —— 出包与发布由 release.yml 负责。
#
# 为什么这些检查不能只留在 release.yml 里：那个流程只在推 tag 时触发，等于"等决定发版了
# 才第一次验证"。v1.0.9 → v1.2.0 之间 123 个文件、上万行改动，中间没有任何一次自动化验证，
# 全靠发版前的第一次跑——真出问题时就只能在"撤回不了"的 Release 和"推迟发版"之间选。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时：PR 只保留最新一次（旧的一律取消），main 上不取消而是排队。
# 原因是被取消的运行在 badge 与提交页上显示为"未通过"——main 上连着推几个提交时，
# 前一个提交永远拿不到结论，外人看到的是红灯，实际什么也没坏。
# PR 上取消是划算的：那次运行的结果本来就会因为新提交而过时。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 静态检查与单元测试
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          # 与 release.yml 保持一致：electron 43 / vue-i18n 11 等依赖要求 Node >= 22.12.0
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # `vite build` 只剥类型不做检查，渲染层（含 .vue 模板）的类型错误只有 vue-tsc 能发现
      - name: 类型检查（主进程 + 测试代码 + 渲染层）
        run: node scripts/run-with-log.mjs 类型检查 npm run typecheck

      # 不加 --fix：CI 要用"当前代码是否合规"做判定，而不是顺手改掉工作区再报绿
      - name: 代码规范检查
        run: node scripts/run-with-log.mjs 代码规范检查 npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-pattern .gitignore

      - name: 单元测试
        run: node scripts/run-with-log.mjs 单元测试 npm run test:run

      # 语言包结构 / manifest 引用 / i18n 键一致性 / 接口端口一致性，这类问题只在浏览器里暴露
      - name: 扩展静态校验
        run: node scripts/run-with-log.mjs 扩展静态校验 npm run check:extension

      # 用真实 aria2 引擎跑扩展接口的全部用例（同时覆盖主进程编译产物）
      - name: 扩展接口端到端验证
        run: |
          npm run build:electron
          node scripts/run-with-log.mjs 扩展接口验证 npm run verify:extension-api

      # 失败时把每个步骤的完整输出带出：GitHub 的作业日志要登录才能看，
      # 注解只带关键几行，完整现场靠这份产物（scripts/run-with-log.mjs 落盘）。
      - name: 保存检查日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: test-results/ci/
          retention-days: 7
          if-no-files-found: ignore

  # 真实启动应用跑一遍。与 release.yml 调用的是同一份定义（见 e2e.yml）
  e2e:
    name: 应用端到端（真跑一遍应用）
    uses: ./.github/workflows/e2e.yml

  # 启动一次真正的打包产物。开发态 e2e 跑的是源码与 dist/，asar 里漏文件、
  # 内置引擎没被带进包、资源路径按 process.resourcesPath 解析——这些问题只在装完之后暴露。
  packaged:
    name: 打包产物冒烟
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # --dir 只出免安装目录（release/win-unpacked），不出安装包：冒烟要的是能直接运行的文件
      - name: 构建免安装目录
        run: |
          npm run build
          npx electron-builder --win --x64 --dir

      - name: 冒烟打包产物
        run: node scripts/smoke-packaged.mjs --timeout 120000

      # 新用户只会走这一条路径：数据目录是空的，配置得应用自己长出来。
      # 老用户的目录里早就有配置，所以平时永远测不到它。
      - name: 冒烟首次启动（空白数据目录）
        run: node scripts/smoke-packaged.mjs --fresh --timeout 120000

      # 作业日志在网页上不好翻，失败时把冒烟自己写的诊断（退出码、stdout/stderr、主进程日志）带出来
      - name: 失败时保留诊断
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
