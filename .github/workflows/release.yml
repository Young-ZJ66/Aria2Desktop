name: 构建并发布

# 推送版本 tag（v1.0.0、v1.0.1 等）时自动构建并发布 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 打包浏览器扩展压缩包
  package-extension:
    name: 打包浏览器扩展
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 打包扩展
        run: |
          cd extension
          zip -r ../Aria2Desktop-Extension-${{ github.ref_name }}.zip \
            manifest.json background.js popup.html popup.js \
            icons/ _locales/ README.md

      - name: 上传扩展产物
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: Aria2Desktop-Extension-*.zip
          if-no-files-found: error

  build:
    needs: [package-extension]
    name: 构建 Windows (${{ matrix.suffix }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - electron_arch: x64   # electron-builder 架构参数（固定值）
            res_arch: x64        # prepare 脚本参数，对应 resources/aria2c-x64.exe
            suffix: x64          # 安装包后缀
          - electron_arch: ia32  # electron-builder 对 32 位使用 ia32（固定值，不可改）
            res_arch: x86        # 对应 resources/aria2c-x86.exe
            suffix: x86

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # electron 43 / vue-i18n 11 等依赖要求 Node >= 22.12.0
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 质量闸门：必须在打包前拦住类型与逻辑错误。
      # 为什么这两步不能省——`vite build` 只剥类型不做检查，渲染层（含 .vue 模板）的
      # 类型错误只有 vue-tsc 能发现；单元测试同理，不在 CI 跑就等于没有。
      - name: 类型检查（主进程 + 测试代码 + 渲染层）
        run: npm run typecheck

      - name: 单元测试
        run: npm run test:run

      # aria2 已随仓库提交，按目标架构就地复制即可，无需联网下载
      - name: 准备对应架构的 aria2c
        run: node scripts/prepare-aria2c.mjs ${{ matrix.res_arch }}

      # 扩展静态校验（语言包结构 / manifest 引用 / i18n 一致性 / 接口端口一致性），
      # 这类问题只能在浏览器里暴露，必须在构建期拦住
      - name: 扩展静态校验
        run: npm run check:extension

      # 本地接口的端到端验证（桩化 settings + 真实 aria2 引擎，跑编译产物），
      # 需要先编译主进程；Windows 运行器自带浏览器与 aria2 资源
      - name: 本地接口端到端验证
        run: |
          npm run build:electron
          npm run verify:extension-api

      # 构建安装包（不发布，产物含 Setup.exe 与 blockmap，仅上传 Setup.exe）
      # 本工作流只做打包，不对安装包做代码签名（扩展 .crx 仍用固定密钥签名，见后文）。
      - name: 构建安装包
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win --publish never --${{ matrix.electron_arch }} --config.win.target=nsis --config.win.artifactName='Aria2Desktop-${version}-${{ matrix.suffix }}-Setup.${ext}'

      # 仅构建 zip 便携版
      - name: 构建便携版 zip
        run: npx electron-builder --win --publish never --${{ matrix.electron_arch }} --config.win.target=zip --config.win.artifactName='Aria2Desktop-${version}-${{ matrix.suffix }}-portable.${ext}'

      # 使用仓库中预写的更新日志（.github/release-notes.md，需在推送 tag 前更新并提交）
      #
      # 版本一致性断言：本仓**真实发生过** tag 与日志错配——v1.0.3 与 v1.0.6 两个 tag 指向了同一个提交，
      # 于是 v1.0.3 的 Release 挂的是 v1.0.6 的更新日志。发出去的 Release 说明无法"撤回重发"，
      # 因此这里不再只检查文件存在，而是要求日志首行的版本号与本次 tag 一致，不一致直接终止发布。
      - name: 使用预写更新日志
        shell: pwsh
        run: |
          $notesPath = '.github/release-notes.md'
          if (-not (Test-Path $notesPath)) {
            Write-Error "未找到 $notesPath，请在推送 tag 前填写更新日志并提交该文件"
            exit 1
          }

          $tag = '${{ github.ref_name }}'
          # 从 tag 提取数字版本（兼容 v1.0.8、1.0.8、v1.0.8-beta.1 等形态）
          $match = [regex]::Match($tag, '^v?(\d+\.\d+\.\d+)')
          if (-not $match.Success) {
            Write-Error "无法从 tag「$tag」解析出版本号，请检查 tag 命名（形如 v1.0.8）"
            exit 1
          }
          $expected = $match.Groups[1].Value
          $firstLine = (Get-Content $notesPath -TotalCount 1).Trim()

          if ($firstLine -notlike "*$expected*") {
            Write-Error ("更新日志与本次 tag 不匹配，已终止发布。" +
              "tag=$tag；期望版本=$expected；日志首行=$firstLine。" +
              "请在推送 tag 前把 $notesPath 的标题改为「# v$expected 更新日志」并提交——Release 说明发布后无法撤回重发。")
            exit 1
          }

          Write-Host "更新日志版本校验通过（$firstLine），将作为 Release 描述"

      # 下载扩展产物
      - name: 下载扩展产物
        uses: actions/download-artifact@v4
        with:
          name: browser-extension
          path: release/

      # 打包已签名的扩展 .crx（用户旁加载用，比 zip 少几步手动操作）。
      # 签名密钥来自 Secret：扩展 ID 由密钥决定，密钥必须固定，否则已安装用户无法升级。
      # 未配置密钥时跳过，不影响其它产物（但产物里不会有 .crx）。
      - name: 打包扩展 .crx
        if: matrix.suffix == 'x64'
        shell: pwsh
        run: |
          if (-not $env:EXTENSION_CRX_KEY) {
            Write-Warning "未配置 EXTENSION_CRX_KEY，跳过 .crx 打包"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path .crx | Out-Null
          # 用 ASCII 写入：PowerShell 5.1 的 utf8 会带 BOM，会导致 PEM 解析失败
          Set-Content -LiteralPath .crx/extension-key.pem -Value $env:EXTENSION_CRX_KEY -NoNewline -Encoding ascii
          node scripts/pack-extension-crx.mjs
        env:
          EXTENSION_CRX_KEY: ${{ secrets.EXTENSION_CRX_KEY }}

      # 用 GitHub CLI 创建/更新 Release，上传安装包、便携版、扩展压缩包与扩展 .crx，
      # 并为每个产物生成同名的 .sha256 文件一并上传——**客户端应用内更新依赖它做强制完整性比对**
      #（UpdateController.verifyChecksum：校验文件存在时必须匹配，否则拒绝安装）。
      # Release 说明只使用 .github/release-notes.md 的内容，不做任何追加。
      - name: 创建 Release 并上传产物
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(
            Get-ChildItem release -Filter "*-Setup.exe"
            Get-ChildItem release -Filter "*-portable.zip"
            Get-ChildItem release -Filter "*.zip" | Where-Object { $_.Name -like "Aria2Desktop-Extension*" }
            Get-ChildItem release -Filter "*.crx"
          )

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Aria2 Desktop $tag" --notes-file .github/release-notes.md
          } else {
            gh release edit $tag --notes-file .github/release-notes.md
          }

          foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -LiteralPath "$($asset.FullName).sha256" -Value $hash -NoNewline -Encoding ascii
            Write-Host "$($asset.Name)  SHA256=$hash"
            gh release upload $tag $asset.FullName --clobber
            gh release upload $tag "$($asset.FullName).sha256" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
