name: 构建并发布

# 推送版本 tag（v1.0.0、v1.0.1 等）时自动构建并发布 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows (${{ matrix.suffix }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - electron_arch: x64   # electron-builder 架构参数（固定值）
            res_arch: x64        # prepare 脚本参数，对应 resources/aria2c-x64.exe
            suffix: x64          # 安装包后缀
          - electron_arch: ia32  # electron-builder 对 32 位使用 ia32（固定值，不可改）
            res_arch: x86        # 对应 resources/aria2c-x86.exe
            suffix: x86

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # electron 43 / vue-i18n 11 等依赖要求 Node >= 22.12.0
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # aria2 已随仓库提交，按目标架构就地复制即可，无需联网下载
      - name: 准备对应架构的 aria2c
        run: node scripts/prepare-aria2c.mjs ${{ matrix.res_arch }}

      # 构建安装包（不发布，产物含 Setup.exe 与 blockmap，仅上传 Setup.exe）
      - name: 构建安装包
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win --publish never --${{ matrix.electron_arch }} --config.win.target=nsis --config.win.artifactName='Aria2Desktop-${version}-${{ matrix.suffix }}-Setup.${ext}'

      # 仅构建 zip 便携版
      - name: 构建便携版 zip
        run: npx electron-builder --win --publish never --${{ matrix.electron_arch }} --config.win.target=zip --config.win.artifactName='Aria2Desktop-${version}-${{ matrix.suffix }}-portable.${ext}'

      # 用 GitHub CLI 创建/更新 Release，只上传安装包与便携版（不含 latest.yml / blockmap）
      - name: 创建 Release 并上传产物
        shell: pwsh
        run: |
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --title "Aria2 Desktop ${{ github.ref_name }}" --generate-notes
          }
          Get-ChildItem release -Filter "*-Setup.exe" | ForEach-Object {
            gh release upload ${{ github.ref_name }} $_.FullName --clobber
          }
          Get-ChildItem release -Filter "*-portable.zip" | ForEach-Object {
            gh release upload ${{ github.ref_name }} $_.FullName --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
