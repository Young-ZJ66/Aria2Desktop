name: 构建并发布

# 推送版本 tag（v1.0.0、v1.0.1 等）时自动构建并发布 Release。
# 发布前依次通过：扩展打包 → 应用端到端测试（真跑一遍应用）→ 创建 Release，
# 然后 Windows / macOS / Linux 三平台并行构建并上传产物。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 打包浏览器扩展压缩包
  package-extension:
    name: 打包浏览器扩展
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 打包扩展
        run: |
          cd extension
          zip -r ../Aria2Desktop-Extension-${{ github.ref_name }}.zip \
            manifest.json background.js popup.html popup.js \
            icons/ _locales/ README.md

      - name: 上传扩展产物
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: Aria2Desktop-Extension-*.zip
          if-no-files-found: error

  # 发布前的端到端闸门：真实启动应用跑一遍"下载 → 解压 → 插件 → 设置"。
  #
  # 为什么发版也要跑一次（ci.yml 已经跑过）：tag 不保证指向 main 上测过的那个提交——
  # 本仓真实发生过 v1.0.3 与 v1.0.6 指向同一个提交，才有的版本守卫。Release 发布后
  # 无法撤回，多等几分钟远好过发出去一个坏版本。步骤定义见 e2e.yml（与 ci.yml 同一份）。
  e2e:
    name: 应用端到端（发布前闸门）
    uses: ./.github/workflows/e2e.yml

  # 质量闸门（类型/单测/扩展静态校验）：三个平台的产物都上传到同一个 Release，
  # 必须先全部过关，任何一个平台才被允许开始构建——否则 Windows 质量失败时
  # mac/linux 的产物照样传上去，用户会装到一个与 tag 不符的混合版本。
  # 每个平台作业里不再重复跑这三步（它们是平台无关的）。
  quality:
    name: 质量闸门
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（主进程 + 测试代码 + 渲染层）
        run: npm run typecheck

      - name: 单元测试
        run: npm run test:run

      - name: 扩展静态校验
        run: npm run check:extension

  # 先把 Release 建出来，三个平台的构建才能并行上传：

  # Windows 构建只等两样：release-init（传递性地保证了 e2e 与质量闸门已经
  # 全绿，且 Release 已建好）+ package-extension（.crx 签名要用的扩展 zip）。
  # 之后与 macOS / Linux 同级并行。
  build:
    needs: [package-extension, release-init]
    name: 构建 Windows (${{ matrix.suffix }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - electron_arch: x64   # electron-builder 架构参数（固定值）
            res_arch: x64        # 引擎目录名，对应 resources/aria2/win32/x64/
            suffix: x64          # 安装包后缀
          - electron_arch: ia32  # electron-builder 对 32 位使用 ia32（固定值，不可改）
            res_arch: ia32       # 对应 resources/aria2/win32/ia32/
            suffix: x86

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          # electron 43 / vue-i18n 11 等依赖要求 Node >= 22.12.0
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 质量闸门（typecheck / 单测 / check:extension）已前移到 quality 作业，
      # 这里只保留 Windows 打包链路。verify-engine 校验的是"本 matrix 腿的目标
      # 架构引擎就位"（x64 与 ia32 各查各的），不属于可共享的质量步骤。
      - name: 校验目标架构的 aria2c
        run: node scripts/verify-engine.mjs win32 ${{ matrix.res_arch }}

      # 本地接口的端到端验证（桩化 settings + 真实 aria2 引擎，跑编译产物），
      # 需要先编译主进程；Windows 运行器自带浏览器与 aria2 资源
      - name: 本地接口端到端验证
        run: |
          npm run build:electron
          npm run verify:extension-api

      # 构建安装包（不发布，产物含 Setup.exe 与 blockmap，仅上传 Setup.exe）
      # 本工作流只做打包，不对安装包做代码签名（扩展 .crx 仍用固定密钥签名，见后文）。
      - name: 构建安装包
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win --publish never --${{ matrix.electron_arch }} --config.win.target=nsis --config.win.artifactName='Aria2Desktop-${version}-${{ matrix.suffix }}-Setup.${ext}'

      # 仅构建 zip 便携版
      - name: 构建便携版 zip
        run: npx electron-builder --win --publish never --${{ matrix.electron_arch }} --config.win.target=zip --config.win.artifactName='Aria2Desktop-${version}-${{ matrix.suffix }}-portable.${ext}'

      # 为安装包生成差量块表（<Setup.exe>.blocks.json，应用端增量更新用它对照新旧分块，
      # hash 相同的块从本地旧包复制、只下载变化部分）。格式与 electron/utils/deltaBlocks.ts 对齐；
      # 便携 zip 不生成——应用内更新只走 NSIS 安装包
      - name: 生成差量块表
        shell: pwsh
        run: |
          Get-ChildItem release -Filter "*-Setup.exe" | ForEach-Object {
            node scripts/generate-delta-blocks.mjs $_.FullName
          }

      # 产物断言：安装包 / 便携版 / 差量块表必须齐全、体积合理、版本号与 package.json 一致。
      # Release 发布后无法撤回重发，这一步失败就直接终止。
      - name: 校验安装包与块表产物
        run: node scripts/verify-dist.mjs win ${{ matrix.res_arch }} --require-blocks

      # 上面那步只查"文件在不在、体积合不合理"，而"装完之后能不能启动"只有真启动一次才知道：
      # asar 漏文件、内置引擎没被带进包，都表现为产物齐全但一开就死。
      # 打 NSIS 时 electron-builder 已经产出 release/win-unpacked，这里直接拿它冒烟，不额外构建。
      - name: 冒烟打包产物
        run: node scripts/smoke-packaged.mjs --timeout 120000

      # 使用仓库中预写的更新日志（.github/release-notes.md，需在推送 tag 前更新并提交）
      #
      # 版本一致性断言：本仓**真实发生过** tag 与日志错配——v1.0.3 与 v1.0.6 两个 tag 指向了同一个提交，
      # 于是 v1.0.3 的 Release 挂的是 v1.0.6 的更新日志。发出去的 Release 说明无法"撤回重发"，
      # 因此这里不再只检查文件存在，而是要求日志首行的版本号与本次 tag 一致，不一致直接终止发布。
      - name: 使用预写更新日志
        shell: pwsh
        run: |
          $notesPath = '.github/release-notes.md'
          if (-not (Test-Path $notesPath)) {
            Write-Error "未找到 $notesPath，请在推送 tag 前填写更新日志并提交该文件"
            exit 1
          }

          $tag = '${{ github.ref_name }}'
          # 从 tag 提取数字版本（兼容 v1.0.8、1.0.8、v1.0.8-beta.1 等形态）
          $match = [regex]::Match($tag, '^v?(\d+\.\d+\.\d+)')
          if (-not $match.Success) {
            Write-Error "无法从 tag「$tag」解析出版本号，请检查 tag 命名（形如 v1.0.8）"
            exit 1
          }
          $expected = $match.Groups[1].Value
          $firstLine = (Get-Content $notesPath -TotalCount 1).Trim()

          if ($firstLine -notlike "*$expected*") {
            Write-Error ("更新日志与本次 tag 不匹配，已终止发布。" +
              "tag=$tag；期望版本=$expected；日志首行=$firstLine。" +
              "请在推送 tag 前把 $notesPath 的标题改为「# v$expected 更新日志」并提交——Release 说明发布后无法撤回重发。")
            exit 1
          }

          Write-Host "更新日志版本校验通过（$firstLine），将作为 Release 描述"

      # 下载扩展产物
      - name: 下载扩展产物
        uses: actions/download-artifact@v8
        with:
          name: browser-extension
          path: release/

      # 打包已签名的扩展 .crx（用户旁加载用，比 zip 少几步手动操作）。
      # 签名密钥来自 Secret：扩展 ID 由密钥决定，密钥必须固定，否则已安装用户无法升级。
      # 未配置密钥时跳过，不影响其它产物（但产物里不会有 .crx）。
      - name: 打包扩展 .crx
        if: matrix.suffix == 'x64'
        shell: pwsh
        run: |
          if (-not $env:EXTENSION_CRX_KEY) {
            Write-Warning "未配置 EXTENSION_CRX_KEY，跳过 .crx 打包"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path .crx | Out-Null
          # 用 ASCII 写入：PowerShell 5.1 的 utf8 会带 BOM，会导致 PEM 解析失败
          Set-Content -LiteralPath .crx/extension-key.pem -Value $env:EXTENSION_CRX_KEY -NoNewline -Encoding ascii
          node scripts/pack-extension-crx.mjs
        env:
          EXTENSION_CRX_KEY: ${{ secrets.EXTENSION_CRX_KEY }}

      # 用 GitHub CLI 创建/更新 Release，上传安装包、便携版、扩展压缩包与扩展 .crx，
      # 并为每个产物生成同名的 .sha256 文件一并上传——**客户端应用内更新依赖它做强制完整性比对**
      #（UpdateController.verifyChecksum：校验文件存在时必须匹配，否则拒绝安装）。
      # Release 说明只使用 .github/release-notes.md 的内容，不做任何追加。
      - name: 创建 Release 并上传产物
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(
            Get-ChildItem release -Filter "*-Setup.exe"
            Get-ChildItem release -Filter "*-Setup.exe.blocks.json"
            Get-ChildItem release -Filter "*-portable.zip"
            Get-ChildItem release -Filter "*.zip" | Where-Object { $_.Name -like "Aria2Desktop-Extension*" }
            Get-ChildItem release -Filter "*.crx"
          )

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Aria2 Desktop $tag" --notes-file .github/release-notes.md
          } else {
            gh release edit $tag --notes-file .github/release-notes.md
          }

          foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -LiteralPath "$($asset.FullName).sha256" -Value $hash -NoNewline -Encoding ascii
            Write-Host "$($asset.Name)  SHA256=$hash"
            gh release upload $tag $asset.FullName --clobber
            gh release upload $tag "$($asset.FullName).sha256" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 先把 Release 建出来，三个平台的构建才能并行上传：
  # gh release upload 要求 Release 已存在。此前创建动作放在 Windows job 里，
  # mac/linux 只能 needs: [build] 串行等待，白白多等一整个 Windows 构建。
  # 版本守卫（日志首行必须含 tag 版本）与 build 作业里的一致，谁先跑谁拦。
  release-init:
    needs: [e2e, quality]
    name: 创建 Release
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 校验更新日志版本
        run: |
          tag="${GITHUB_REF_NAME}"
          expected=$(printf '%s' "$tag" | sed -n 's/^v\?\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
          if [ -z "$expected" ]; then
            echo "无法从 tag「$tag」解析出版本号，请检查 tag 命名（形如 v1.2.1）" >&2
            exit 1
          fi
          first=$(head -n1 .github/release-notes.md | tr -d '\r')
          case "$first" in
            *"$expected"*) ;;
            *)
              echo "更新日志与本次 tag 不匹配，已终止发布。" >&2
              echo "tag=$tag；期望版本=$expected；日志首行=$first" >&2
              echo "请把 .github/release-notes.md 首行改为「# v$expected 更新日志」并提交后重新打 tag。" >&2
              exit 1
              ;;
          esac
          echo "更新日志版本校验通过：$first"

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file .github/release-notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Aria2 Desktop $tag" --notes-file .github/release-notes.md
          fi

  # macOS 安装包：在真实的 macOS 运行器上构建（Windows 无法交叉产出 dmg）。
  # Release 已由 release-init 建好（其前置是 e2e + quality 闸门），
  # 与 Windows 构建并行上传资产；类型/单测/扩展校验不再在此重复。
  build-mac:
    needs: [release-init]
    name: 构建 macOS
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 双架构（Intel / Apple Silicon）都要有引擎，且冒烟当前运行器架构
      - name: 校验 aria2 引擎（x64 / arm64）
        run: |
          node scripts/verify-engine.mjs darwin x64
          node scripts/verify-engine.mjs darwin arm64
          ./resources/aria2/darwin/${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}/aria2c --version

      - name: 构建安装包
        run: npm run build && npx electron-builder --mac --publish never

      - name: 校验安装包产物
        run: node scripts/verify-dist.mjs mac

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for f in release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            gh release upload "$tag" "$f" "$f.sha256" --clobber
          done

  # Linux 安装包：AppImage + deb（x64）
  build-linux:
    needs: [release-init]
    name: 构建 Linux
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 aria2 引擎
        run: |
          node scripts/verify-engine.mjs linux x64
          ./resources/aria2/linux/x64/aria2c --version

      - name: 构建安装包
        run: npm run build && npx electron-builder --linux --x64 --publish never

      - name: 校验安装包产物
        run: node scripts/verify-dist.mjs linux

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for f in release/*.AppImage release/*.deb; do
            [ -e "$f" ] || continue
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            gh release upload "$tag" "$f" "$f.sha256" --clobber
          done
