name: 构建 macOS / Linux 安装包

# 手动触发：在不发版的前提下产出 macOS / Linux 安装包，供人工验证与试装。
#
# 产物除了静态校验（文件齐、体积对）之外，还会**真的启动一次**：macOS 直接跑
# .app 里的可执行文件，Linux 用 xvfb 造虚拟屏再跑。能不能起来、引擎有没有拉起来、
# 本地接口有没有监听——这些静态校验看不出来。
#
# 与 release.yml 的分工：
# - release.yml 打 tag 时会在真实 macos-latest / ubuntu-latest 上构建，并把产物挂到 Release；
# - 本流程只上传 Actions 产物（workflow artifact），**不创建 Release、不碰 tag**，
#   用于改完跨平台相关代码后先"裸装一次"确认没问题，再决定要不要发版。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 目标平台
        required: true
        default: both
        type: choice
        options:
          - both
          - mac
          - linux

permissions:
  contents: read

jobs:
  build-mac:
    if: inputs.platform != 'linux'
    name: 构建 macOS
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 质量闸门与 Windows 一致：类型检查 + 单测 + 扩展静态校验
      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test:run

      - name: 扩展静态校验
        run: npm run check:extension

      # 引擎二进制缺失时这里会明确报错并给出编译指引（见 resources/aria2/README.md）
      - name: 校验 aria2 引擎
        run: node scripts/verify-engine.mjs darwin ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      # 在真实 macOS 上冒烟：确认二进制可执行（架构匹配、未损坏）
      - name: 引擎可执行性冒烟
        run: ./resources/aria2/darwin/${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}/aria2c --version

      - name: 构建安装包
        run: |
          npm run build
          npx electron-builder --mac --publish never

      # 防止 electron-builder "命令成功但产物不全"：dmg/zip 的 x64 与 arm64 必须齐全且体积合理
      - name: 校验安装包产物
        run: node scripts/verify-dist.mjs mac

      # 静态校验只能证明"文件在、体积对"，证明不了"装完能起来"。
      # 这里真的启动一次 .app：引擎起没起来、本地接口有没有监听，只有跑过才知道。
      # 顺序放在上传之后：冒烟失败不该连产物都拿不到——手动跑一次就是为了拿到包 + 结论。
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: 冒烟打包产物（启动一次）
        run: node scripts/smoke-packaged.mjs --timeout 120000 --spawn-args=--disable-gpu

      # 冒烟脚本失败时会把主进程日志与结构化诊断写到 test-results/，这是排查"为什么起不来"的唯一现场
      - name: 冒烟失败时保存现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-mac
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-linux:
    if: inputs.platform != 'mac'
    name: 构建 Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            artifact: linux-installers-x64
            smoke: true
          - arch: arm64
            artifact: linux-installers-arm64
            smoke: false
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test:run

      - name: 扩展静态校验
        run: npm run check:extension

      - name: 校验 aria2 引擎
        run: node scripts/verify-engine.mjs linux ${{ matrix.arch }}

      # 在真实 Linux 上冒烟：确认二进制可执行（ELF 架构匹配、未损坏）
      - name: 引擎可执行性冒烟
        if: matrix.arch == 'x64'
        run: ./resources/aria2/linux/x64/aria2c --version

      - name: 构建安装包
        run: npm run build && npx electron-builder --linux --${{ matrix.arch }} --publish never

      # AppImage 与 deb 必须同时存在且体积合理
      - name: 校验安装包产物
        run: node scripts/verify-dist.mjs linux ${{ matrix.arch }}

      # Linux 上是无显示环境：用 xvfb 造一块虚拟屏，再启动一次打包产物。
      # --no-sandbox 只为容器里没有 user namespace 的情况（只关渲染进程沙箱，启动路径不变）。
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      - name: 准备虚拟显示
        if: matrix.smoke
        run: command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 冒烟打包产物（启动一次）
        if: matrix.smoke
        run: xvfb-run -a node scripts/smoke-packaged.mjs --timeout 120000 --spawn-args="--no-sandbox --disable-gpu --disable-dev-shm-usage"

      - name: 冒烟失败时保存现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-linux-${{ matrix.arch }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
