## 参考配置（仅供查阅）
##
## ⚠️ 本文件**不参与打包、运行时也不会被读取**：应用真正使用的配置由
## electron/utils/aria2ConfigManager.ts 的 createDefaultConfig() 生成，
## 位于 <userData>/aria2/aria2.conf（下载目录取系统「下载」文件夹，端口默认 6800）。
##
## 它此前是一份开发者本机配置（含 D:/Downloads、D:/Develop/... 等绝对路径，
## 且 rpc-listen-all=true 而没有密钥）。保留下来只为参考选项写法，已改为**安全默认值**：
## 若将来有人把它接进打包流程（package.json 的 extraResources），也不会因此把 RPC 暴露到局域网。
##
## 修改默认配置请改 createDefaultConfig()，不要改这里。

## 下载目录 ##
# dir 由应用按系统「下载」文件夹写入运行时配置；此处刻意不预置绝对路径

## 断点续传与重名 ##
continue=true
auto-file-renaming=true

## 并发与分片 ##
max-concurrent-downloads=5
max-connection-per-server=16
min-split-size=10M
split=16

## 会话 ##
save-session-interval=60

## RPC ##
# 只监听回环地址：rpc-secret 由应用自动生成并写入运行时配置，这里不预置任何密钥
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-allow-origin-all=true

## 日志 ##
log-level=warn
max-mmap-limit=0
