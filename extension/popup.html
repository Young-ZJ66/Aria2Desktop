<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a4a;
    }
    .header img { width: 32px; height: 32px; border-radius: 6px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.connected { background: rgba(76, 175, 80, 0.15); color: #4caf50; }
    .status.disconnected { background: rgba(244, 67, 54, 0.15); color: #f44336; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status.connected .status-dot { background: #4caf50; }
    .status.disconnected .status-dot { background: #f44336; }
    .section { margin-bottom: 16px; }
    .section-title { font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      background: #0f0f23;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
    }
    .form-group input:focus { border-color: #4f6ef2; outline: none; }
    .row { display: flex; gap: 8px; }
    .row .form-group { flex: 1; }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle-group label { font-size: 13px; }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      cursor: pointer;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #2a2a4a;
      border-radius: 11px;
      transition: 0.2s;
    }
    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #e0e0e0;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .slider { background: #4f6ef2; }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: #4f6ef2; color: white; }
    .btn-primary:hover { background: #3d5bd9; }
    .btn-secondary { background: #2a2a4a; color: #e0e0e0; margin-top: 8px; }
    .btn-secondary:hover { background: #3a3a5a; }
    .footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2a2a4a;
      text-align: center;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Aria2">
    <h1>Aria2 Desktop</h1>
  </div>

  <div id="status" class="status disconnected">
    <span class="status-dot"></span>
    <span id="statusText"></span>
  </div>

  <div class="section">
    <div class="section-title" id="connectionTitle"></div>
    <div class="row">
      <div class="form-group">
        <label id="hostLabel"></label>
        <input type="text" id="host" value="localhost">
      </div>
      <div class="form-group">
        <label id="portLabel"></label>
        <input type="number" id="port" value="6800">
      </div>
    </div>
    <div class="form-group">
      <label id="secretLabel"></label>
      <input type="password" id="secret" placeholder="RPC Secret">
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="settingsTitle"></div>
    <div class="toggle-group">
      <label id="enableLabel"></label>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-group">
      <label id="interceptLabel"></label>
      <label class="toggle">
        <input type="checkbox" id="interceptAll">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button class="btn btn-primary" id="saveBtn"></button>
  <button class="btn btn-secondary" id="testBtn"></button>

  <div class="footer" id="footerHint"></div>

  <script src="popup.js"></script>
</body>
</html>
