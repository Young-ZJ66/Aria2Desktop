<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* 用 CSS 变量组织配色：跟随系统深浅色，避免浅色系统下弹窗仍是刺眼的深色 */
    :root {
      --bg: #1a1a2e;
      --panel: #0f0f23;
      --border: #2a2a4a;
      --text: #e0e0e0;
      --text-dim: #8a8f99;
      --toggle-off: #2a2a4a;
      --primary: #4f6ef2;
      --primary-hover: #3d5bd9;
      --secondary: #2a2a4a;
      --secondary-hover: #3a3a5a;
      --success: #4caf50;
      --danger: #f44336;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --panel: #f6f7f9;
        --border: #e3e5ea;
        --text: #1f2329;
        --text-dim: #8a8f99;
        --toggle-off: #d6d9e0;
        --secondary: #eef0f4;
        --secondary-hover: #e2e5ec;
        --success: #2e7d32;
        --danger: #d32f2f;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header img { width: 32px; height: 32px; border-radius: 6px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 13px;
      word-break: break-word;
    }
    .status.connected { background: rgba(76, 175, 80, 0.15); color: var(--success); }
    .status.disconnected { background: rgba(244, 67, 54, 0.15); color: var(--danger); }
    .status-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
    .status.connected .status-dot { background: var(--success); }
    .status.disconnected .status-dot { background: var(--danger); }
    .section { margin-bottom: 14px; }
    .section-title { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
    }
    .form-group input:focus { border-color: var(--primary); outline: none; }
    .hint {
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-dim);
    }
    .row { display: flex; gap: 8px; }
    .row .form-group { flex: 1; }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
    }
    .toggle-group label { font-size: 13px; }
    .toggle { position: relative; flex: none; width: 40px; height: 22px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: var(--toggle-off);
      border-radius: 11px;
      transition: 0.2s;
    }
    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .slider { background: var(--primary); }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary { background: var(--secondary); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: var(--secondary-hover); }
    .btn-row { display: flex; gap: 8px; }
    /* 反馈区固定占位，避免出现/消失时弹窗高度跳动 */
    .feedback {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
      color: var(--text-dim);
    }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--danger); }
    .footer {
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-dim);
    }
    /* 仅供读屏使用的标签（视觉上隐藏但保留语义，避免快捷发送的输入框没有名字） */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <h1>Aria2 Desktop</h1>
  </div>

  <div id="status" class="status disconnected" role="status" aria-live="polite">
    <span class="status-dot"></span>
    <span id="statusText"></span>
  </div>

  <!-- 快速发送：把最常用的动作放在最上面（原先只能靠右键菜单，弹窗里没有任何发送入口） -->
  <div class="section">
    <div class="section-title" id="quickSendTitle"></div>
    <div class="form-group">
      <label for="quickUrl" class="visually-hidden" id="quickUrlLabel"></label>
      <input type="text" id="quickUrl" spellcheck="false">
    </div>
    <button class="btn btn-primary" id="sendBtn" type="button"></button>
  </div>

  <div class="section">
    <div class="section-title" id="connectionTitle"></div>
    <div class="row">
      <div class="form-group">
        <label for="host" id="hostLabel"></label>
        <input type="text" id="host" value="localhost" spellcheck="false">
      </div>
      <div class="form-group">
        <label for="port" id="portLabel"></label>
        <input type="number" id="port" value="6800" min="1" max="65535">
      </div>
    </div>
    <div class="form-group">
      <label for="secret" id="secretLabel"></label>
      <input type="password" id="secret" placeholder="RPC Secret" autocomplete="off">
      <p class="hint" id="secretHint"></p>
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="optionsTitle"></div>
    <div class="toggle-group">
      <label for="enabled" id="enableLabel"></label>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-group">
      <label for="interceptAll" id="interceptLabel"></label>
      <label class="toggle">
        <input type="checkbox" id="interceptAll">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-group">
      <label for="allowProbe" id="allowProbeLabel"></label>
      <label class="toggle">
        <input type="checkbox" id="allowProbe">
        <span class="slider"></span>
      </label>
    </div>
    <p class="hint" id="allowProbeHint"></p>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="saveBtn" type="button"></button>
    <button class="btn btn-secondary" id="testBtn" type="button"></button>
  </div>

  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
  <div class="footer" id="footerHint"></div>

  <script src="popup.js"></script>
</body>
</html>
