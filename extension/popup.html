<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* 跟随系统深浅色；主色与 Aria2 Desktop 品牌一致 */
    :root {
      --bg: #1a1a2e;
      --panel: #0f0f23;
      --border: #2a2a4a;
      --text: #e0e0e0;
      --text-dim: #8a8f99;
      --toggle-off: #2a2a4a;
      --primary: #4f6ef2;
      --primary-hover: #3d5bd9;
      --secondary: #2a2a4a;
      --secondary-hover: #3a3a5a;
      --success: #4caf50;
      --success-bg: rgba(76, 175, 80, 0.12);
      --danger: #f44336;
      --danger-bg: rgba(244, 67, 54, 0.12);
      --warn: #e8a33d;
      --warn-bg: rgba(232, 163, 61, 0.12);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --panel: #f6f7f9;
        --border: #e3e5ea;
        --text: #1f2329;
        --text-dim: #8a8f99;
        --toggle-off: #d6d9e0;
        --secondary: #eef0f4;
        --secondary-hover: #e2e5ec;
        --success: #2e7d32;
        --success-bg: rgba(46, 125, 50, 0.1);
        --danger: #d32f2f;
        --danger-bg: rgba(211, 47, 47, 0.08);
        --warn: #b97a12;
        --warn-bg: rgba(185, 122, 18, 0.1);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* hidden 属性必须真正隐藏。.banner / .media-list 等作者样式里的 display 会覆盖
       浏览器内置的 [hidden]{display:none}——已配对用户仍看到"尚未配对"横幅就是这么来的 */
    [hidden] { display: none !important; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px 12px 10px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .header img { width: 24px; height: 24px; border-radius: 5px; }
    .header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }

    /* 状态胶囊放在标题右侧：省掉一整行高度，长文案单行截断（完整内容在 title 里） */
    .status {
      margin-left: auto;
      flex: none;
      max-width: 172px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .status-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status.connected { background: var(--success-bg); border-color: transparent; color: var(--success); }
    .status.disconnected { background: var(--danger-bg); border-color: transparent; color: var(--danger); }
    .status-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
    .status.connected .status-dot { background: var(--success); }
    .status.disconnected .status-dot { background: var(--danger); }
    .status.loading .status-dot {
      background: var(--primary);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.72); }
    }

    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 10px;
      padding: 2px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .tab {
      flex: 1;
      padding: 6px 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab:hover:not(.active) { color: var(--text); background: var(--secondary); }
    .tab.active { background: var(--primary); color: #fff; }
    .pane { display: none; }
.pane.active { display: block; }
.grab-list {
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
}
.grab-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 10px;
  font-size: 12px;
  line-height: 1.4;
  cursor: pointer;
}
.grab-item:hover { background: var(--secondary); }
.grab-item + .grab-item { border-top: 1px solid var(--border); }
.grab-item input { flex: none; margin-top: 2px; }
.grab-item .g-text { flex: 1; min-width: 0; word-break: break-all; color: var(--text); }
.grab-item .g-url { display: block; font-size: 11px; color: var(--text-dim); }
.grab-filter input { width: 100%; }
    .pane.active { display: block; }

    /* 未配对引导横幅：出现在发送页顶部，把"下一步做什么"直接告诉用户 */
    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;
      border-radius: 7px;
      background: var(--warn-bg);
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--warn);
    }
    .banner button {
      flex: none;
      padding: 4px 10px;
      border: none;
      border-radius: 5px;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .banner button:hover { background: var(--primary-hover); }

    .section { margin-bottom: 10px; }
    .section-title {
      font-size: 10.5px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 11.5px; color: var(--text-dim); margin-bottom: 3px; }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%;
      padding: 6px 9px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12.5px;
      transition: border-color 0.15s;
    }
    .input-wrap input:focus { border-color: var(--primary); outline: none; }
    .input-wrap input.invalid { border-color: var(--danger); }
    /* 输入框内嵌的次要按钮（粘贴/显示密钥） */
    .input-suffix {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      padding: 2px 7px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .input-suffix:hover { color: var(--text); background: var(--secondary); }
    .hint {
      margin-top: 4px;
      font-size: 10.5px;
      line-height: 1.5;
      color: var(--text-dim);
    }
    .row { display: flex; gap: 8px; }
    .row .form-group { flex: 1; }

    /* 输入框 + 发送按钮同一行：少一行高度，日常操作路径更短 */
    .send-row { display: flex; gap: 6px; }
    .send-row .input-wrap { flex: 1; min-width: 0; }
    .send-row .btn { flex: none; width: auto; min-width: 62px; padding: 0 12px; }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
    }
    .toggle-group + .toggle-group { border-top: 1px solid var(--border); }
    .toggle-group .t-label { font-size: 12.5px; }
    .toggle-group .t-desc {
      margin-top: 1px;
      font-size: 10.5px;
      line-height: 1.4;
      color: var(--text-dim);
    }
    .toggle { position: relative; flex: none; width: 38px; height: 21px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: var(--toggle-off);
      border-radius: 11px;
      transition: 0.2s;
    }
    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 15px;
      height: 15px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .slider { background: var(--primary); }
    .toggle input:checked + .slider::before { transform: translateX(17px); }

    .btn {
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 7px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary { background: var(--secondary); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: var(--secondary-hover); }
    .btn-danger-ghost {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--border);
    }
    .btn-danger-ghost:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger); }
    .btn-danger-ghost.armed {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    /* 手动配置折叠区：默认收起，日常只看到一键配对 */
    details.manual {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
    }
    details.manual summary {
      padding: 7px 10px;
      font-size: 11.5px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    details.manual summary::-webkit-details-marker { display: none; }
    details.manual summary:hover { color: var(--text); }
    details.manual[open] summary { border-bottom: 1px solid var(--border); }
    details.manual .manual-body { padding: 10px; }

    .feedback {
      min-height: 16px;
      margin-top: 6px;
      font-size: 11.5px;
      line-height: 1.5;
      word-break: break-word;
      color: var(--text-dim);
    }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--danger); }

    .footer {
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 10.5px;
      line-height: 1.5;
      color: var(--text-dim);
    }
    /* 本页视频列表：每行一个可直接下载的地址 + 发送按钮 */
    .media-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .media-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
    }
    .media-url {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-kind {
      flex: none;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--text-dim);
    }
    .media-item button {
      flex: none;
      padding: 3px 8px;
      border: none;
      border-radius: 4px;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .media-item button:hover { background: var(--primary-hover); }
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <h1>Aria2 Desktop</h1>
    <div id="status" class="status loading" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span id="statusText" class="status-text"></span>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tabSend" type="button" role="tab" aria-selected="true" aria-controls="paneSend"></button>
    <button class="tab" id="tabGrab" type="button" role="tab" aria-selected="false" aria-controls="paneGrab"></button>
    <button class="tab" id="tabConnect" type="button" role="tab" aria-selected="false" aria-controls="paneConnect"></button>
  </div>

  <!-- 模式一：发送下载 -->
  <div class="pane active" id="paneSend" role="tabpanel">
    <div id="pairBanner" class="banner" hidden>
      <span id="pairBannerText"></span>
      <button id="bannerPairBtn" type="button"></button>
    </div>
    <div class="section">
      <div class="section-title" id="quickSendTitle"></div>
      <div class="send-row">
        <label for="quickUrl" class="visually-hidden" id="quickUrlLabel"></label>
        <div class="input-wrap">
          <input type="text" id="quickUrl" spellcheck="false">
          <button class="input-suffix" id="pasteBtn" type="button" title=""></button>
        </div>
        <button class="btn btn-primary" id="sendBtn" type="button"></button>
      </div>
    </div>
    <div class="section">
      <div class="section-title" id="mediaTitle"></div>
      <button class="btn btn-secondary" id="pageVideoBtn" type="button"></button>
      <div class="media-list" id="mediaList" hidden></div>
      <p class="hint" id="mediaHint" hidden></p>
    </div>
    <div class="footer" id="footerHint"></div>
  </div>

  <!-- 模式二：批量抓取页面链接 -->
  <div class="pane" id="paneGrab" role="tabpanel">
    <div class="section">
      <button class="btn btn-primary" id="grabBtn" type="button"></button>
      <div id="grabFilterWrap" class="input-wrap grab-filter" hidden>
        <input type="text" id="grabFilter" spellcheck="false">
      </div>
    </div>
    <div id="grabListWrap" class="section grab-list" hidden>
      <div id="grabList"></div>
    </div>
    <button class="btn btn-primary" id="sendSelectedBtn" type="button" hidden></button>
  </div>

  <!-- 模式三：配对与设置 -->
  <div class="pane" id="paneConnect" role="tabpanel">
    <div class="section">
      <div class="section-title" id="pairingTitle"></div>
      <button class="btn btn-primary" id="pairBtn" type="button"></button>
      <p class="hint" id="pairHint"></p>
    </div>

    <div class="section">
      <div class="section-title" id="optionsTitle"></div>
      <div class="toggle-group">
        <div>
          <div class="t-label" id="enableLabel"></div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="enabled" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-group">
        <div>
          <div class="t-label" id="interceptLabel"></div>
          <div class="t-desc" id="interceptDesc"></div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="interceptAll">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-group">
        <div>
          <div class="t-label" id="allowCookiesLabel"></div>
          <div class="t-desc" id="allowCookiesDesc"></div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="allowCookies">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <details class="manual" id="manualDetails">
      <summary id="manualTitle"></summary>
      <div class="manual-body">
        <div class="row">
          <div class="form-group">
            <label for="host" id="hostLabel"></label>
            <div class="input-wrap"><input type="text" id="host" value="localhost" spellcheck="false"></div>
          </div>
          <div class="form-group">
            <label for="port" id="portLabel"></label>
            <div class="input-wrap"><input type="number" id="port" value="6800" min="1" max="65535"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="secret" id="secretLabel"></label>
          <div class="input-wrap">
            <input type="password" id="secret" placeholder="RPC Secret" autocomplete="off">
          </div>
          <p class="hint" id="secretHint"></p>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="testBtn" type="button"></button>
          <button class="btn btn-primary" id="saveBtn" type="button"></button>
        </div>
      </div>
    </details>
  </div>

  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
